<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f86">
<meta name="description" content="Aqua Super customer, daily entry, payment and due management">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Aqua Super</title>
<style>
:root{--blue:#0b638d;--cyan:#10a9df;--ink:#18324a;--muted:#6c7a88;--bg:#f2f5fa;--card:#fff;--red:#d62f32;--green:#16834a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--blue);color:#fff;padding:22px 22px 28px;border-radius:0 0 34px 34px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:29px}header .date{margin-top:4px;font-size:17px}
main{max-width:760px;margin:auto;padding:18px 14px 92px}.card{background:var(--card);border-radius:24px;padding:18px;margin-bottom:16px;box-shadow:0 2px 14px #18324a12}
label{display:block;color:var(--muted);font-size:14px;margin-bottom:7px}input,select{width:100%;padding:14px 15px;border:1px solid #cbd5df;border-radius:16px;font-size:16px;background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{padding:18px;border-radius:23px;background:#fff;box-shadow:0 2px 14px #18324a12}.stat .t{color:var(--muted);font-size:16px}.stat .v{font-size:29px;font-weight:750;margin-top:5px}.red{color:var(--red)}.green{color:var(--green)}
button{border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--cyan);color:#fff}.secondary{background:#e8f1f7;color:var(--ink)}.danger{background:#ffe7e7;color:#b51e22}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7dfe7;display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav button{border-radius:0;background:#fff;color:#667483;padding:11px 4px;font-size:13px}.nav button.active{color:#0b638d;font-weight:800}
.item{padding:14px 0;border-bottom:1px solid #e7ebef}.item:last-child{border-bottom:0}.item .name{font-weight:800;font-size:17px}.small{font-size:13px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf5fa;font-size:12px;margin:3px 4px 0 0}
.hidden{display:none}.toast{position:fixed;left:16px;right:16px;bottom:76px;background:#18324a;color:#fff;padding:13px 15px;border-radius:14px;text-align:center;z-index:20}
h2{margin:0 0 14px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.empty{color:var(--muted);text-align:center;padding:20px}
@media(max-width:520px){.grid{gap:10px}.stat{padding:15px}.stat .v{font-size:25px}}
</style>
</head>
<body>
<header>
  <h1>💧 Aqua Super</h1>
  <div class="date" id="todayText"></div>
</header>

<main>
<section id="home" class="page">
  <div class="card">
    <label>📅 Dashboard Date</label>
    <input type="date" id="dashDate">
    <div class="small" id="selectedDateText" style="margin-top:8px"></div>
  </div>
  <div class="grid">
    <div class="stat"><div class="t">Total Customers</div><div class="v" id="sCustomers">0</div></div>
    <div class="stat"><div class="t">Today Sales</div><div class="v" id="sSales">₹0</div></div>
    <div class="stat"><div class="t">Today Payment</div><div class="v" id="sPayment">₹0</div></div>
    <div class="stat"><div class="t">Due</div><div class="v red" id="sDue">₹0</div></div>
    <div class="stat"><div class="t">Jar Given</div><div class="v" id="sJar">0</div></div>
    <div class="stat"><div class="t">Can Given</div><div class="v" id="sCan">0</div></div>
  </div>
  <div class="row" style="margin:16px 0">
    <button class="primary" onclick="showPage('customers')">👤 Add / Search Customer</button>
    <button class="primary" onclick="showPage('entry')">➕ New Daily Entry</button>
  </div>
  <div class="card">
    <div class="sectionTitle"><h2>🔴 Customers With Due</h2><span class="small" id="dueCount"></span></div>
    <input id="dueSearch" placeholder="🔎 Customer name ya mobile number search karein" oninput="renderDue()">
    <div id="dueList"></div>
  </div>
</section>

<section id="customers" class="page hidden">
  <div class="card">
    <h2>👥 Customers</h2>
    <input id="customerSearch" placeholder="🔎 Name / Mobile / Address" oninput="renderCustomers()">
  </div>
  <div class="card" id="customerFormCard">
    <h2 id="formTitle">➕ Add Customer</h2>
    <input id="cName" placeholder="Customer name" style="margin-bottom:10px">
    <input id="cMobile" placeholder="Mobile number" style="margin-bottom:10px">
    <input id="cAddress" placeholder="Address" style="margin-bottom:10px">
    <div class="grid">
      <input id="cJarRate" type="number" placeholder="Jar rate">
      <input id="cCanRate" type="number" placeholder="Can rate">
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary" onclick="saveCustomer()">Save Customer</button>
      <button class="secondary" onclick="clearCustomerForm()">Clear</button>
    </div>
  </div>
  <div class="card"><div id="customerList"></div></div>
</section>

<section id="entry" class="page hidden">
  <div class="card">
    <h2>➕ New Daily Entry</h2>
    <label>Date</label><input type="date" id="eDate">
    <label style="margin-top:10px">Customer</label><select id="eCustomer"></select>
    <div class="grid" style="margin-top:10px">
      <input id="eJg" type="number" min="0" value="1" placeholder="Jar Given">
      <input id="eJe" type="number" min="0" value="1" placeholder="Jar Empty">
      <input id="eCg" type="number" min="0" value="0" placeholder="Can Given">
      <input id="eCe" type="number" min="0" value="0" placeholder="Can Empty">
    </div>
    <div class="grid" style="margin-top:10px">
      <input id="eAmount" type="number" min="0" placeholder="Amount">
      <input id="ePaid" type="number" min="0" placeholder="Paid">
    </div>
    <div class="small" id="entryHint" style="margin-top:10px"></div>
    <button class="primary" style="width:100%;margin-top:12px" onclick="saveEntry()">Save Daily Entry</button>
  </div>
</section>

<section id="history" class="page hidden">
  <div class="card">
    <h2>📜 History</h2>
    <input type="date" id="hDate" onchange="renderHistory()">
    <input id="hSearch" placeholder="🔎 Search customer" style="margin-top:10px" oninput="renderHistory()">
  </div>
  <div class="card"><div id="historyList"></div></div>
</section>

<section class="card">
  <h2>💾 Backup & Restore</h2>
  <div class="row">
    <button class="secondary" onclick="downloadBackup()">Download Backup</button>
    <button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore Backup</button>
    <button class="danger" onclick="resetToBundled()">Reset to 24 Aug Backup</button>
  </div>
  <input id="restoreFile" type="file" accept=".json,application/json" class="hidden" onchange="restoreBackup(event)">
  <div class="small" style="margin-top:10px">Bundled backup: 116 customers and 122 daily entries.</div>
</section>
</main>

<nav class="nav">
<button id="nav-home" class="active" onclick="showPage('home')">🏠<br>Home</button>
<button id="nav-customers" onclick="showPage('customers')">👥<br>Customers</button>
<button id="nav-entry" onclick="showPage('entry')">📊<br>Daily Entry</button>
<button id="nav-history" onclick="showPage('history')">🔎<br>History</button>
</nav>
<div id="toast" class="toast hidden"></div>

const DATA_VERSION = "2026-08-24-116-customers-v4";
const KEY = "aqua_super_data_v3";
const VERKEY = "aqua_super_data_version_v3";
let state = loadState();
let editingMobile = null;

function clone(x){return JSON.parse(JSON.stringify(x))}
function loadState(){
  try{
    const v=localStorage.getItem(VERKEY), raw=localStorage.getItem(KEY);
    if(v===DATA_VERSION && raw){
      const saved=JSON.parse(raw);
      if(saved && Array.isArray(saved.customers) && saved.customers.length>0) return saved;
    }
  }catch(e){}
  const fresh=clone(BUNDLED_DATA);
  localStorage.setItem(VERKEY,DATA_VERSION);
  localStorage.setItem(KEY,JSON.stringify(fresh));
  return fresh;
}
function saveState(){localStorage.setItem(KEY,JSON.stringify(state)); localStorage.setItem(VERKEY,DATA_VERSION)}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
function dateISO(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function fmtDate(s){if(!s)return ""; return new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.remove("hidden");setTimeout(()=>x.classList.add("hidden"),1800)}
function showPage(id){
  document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  const n=document.getElementById("nav-"+id); if(n)n.classList.add("active");
  if(id==="home")renderHome(); if(id==="customers")renderCustomers(); if(id==="entry")prepareEntry(); if(id==="history")renderHistory();
  scrollTo(0,0);
}
function renderHome(){
  const d=document.getElementById("dashDate").value||dateISO();
  document.getElementById("selectedDateText").textContent="Selected: "+fmtDate(d);
  document.getElementById("sCustomers").textContent=state.customers.length;
  const es=state.entries.filter(e=>e.date===d);
  document.getElementById("sSales").textContent=money(es.reduce((a,e)=>a+Number(e.amount||0),0));
  document.getElementById("sPayment").textContent=money(es.reduce((a,e)=>a+Number(e.paid||0),0));
  // Due is the imported customer's current openDue total, matching the backup's stored balances.
  document.getElementById("sDue").textContent=money(state.customers.reduce((a,c)=>a+Number(c.openDue||0),0));
  document.getElementById("sJar").textContent=es.reduce((a,e)=>a+Number(e.jg||0),0);
  document.getElementById("sCan").textContent=es.reduce((a,e)=>a+Number(e.cg||0),0);
  renderDue();
}
function renderDue(){
  const q=(document.getElementById("dueSearch").value||"").toLowerCase().trim();
  const arr=state.customers.filter(c=>Number(c.openDue||0)>0 && (!q || (c.name+" "+c.mobile+" "+c.address).toLowerCase().includes(q)));
  document.getElementById("dueCount").textContent=arr.length+" customers";
  document.getElementById("dueList").innerHTML=arr.length?arr.map(c=>`<div class="item"><div class="name">${esc(c.name)}</div><div class="small">${esc(c.mobile)} · ${esc(c.address||"")}</div><span class="pill">Due ${money(c.openDue)}</span><span class="pill">Jar ${c.openJar||0}</span></div>`).join(""):`<div class="empty">Abhi koi due customer nahi.</div>`;
}
function renderCustomers(){
  const q=(document.getElementById("customerSearch").value||"").toLowerCase().trim();
  const arr=state.customers.filter(c=>(c.name+" "+c.mobile+" "+c.address).toLowerCase().includes(q));
  document.getElementById("customerList").innerHTML=arr.map(c=>`<div class="item"><div class="sectionTitle"><div><div class="name">${esc(c.name)}</div><div class="small">${esc(c.mobile)} · ${esc(c.address||"")}</div></div><div><button class="secondary" onclick='editCustomer(${JSON.stringify(c.mobile)})'>Edit</button></div></div><span class="pill">₹${Number(c.jarRate||0)}/Jar</span><span class="pill">Due ${money(c.openDue)}</span><span class="pill">Jar ${c.openJar||0}</span></div>`).join("");
}
function editCustomer(mobile){
  const c=state.customers.find(x=>x.mobile===mobile);if(!c)return;
  editingMobile=mobile; document.getElementById("formTitle").textContent="✏️ Edit Customer";
  cName.value=c.name;cMobile.value=c.mobile;cAddress.value=c.address||"";cJarRate.value=c.jarRate||0;cCanRate.value=c.canRate||0;
  document.getElementById("customerFormCard").scrollIntoView({behavior:"smooth"});
}
function clearCustomerForm(){editingMobile=null;formTitle.textContent="➕ Add Customer";cName.value=cMobile.value=cAddress.value="";cJarRate.value=25;cCanRate.value=0}
function saveCustomer(){
  const name=cName.value.trim(),mobile=cMobile.value.trim();if(!name||!mobile){toast("Name aur mobile zaroori hai");return}
  if(editingMobile){
    const c=state.customers.find(x=>x.mobile===editingMobile);Object.assign(c,{name,mobile,address:cAddress.value.trim(),jarRate:+cJarRate.value||0,canRate:+cCanRate.value||0});
  }else{
    if(state.customers.some(c=>c.mobile===mobile)){toast("Mobile already exists");return}
    state.customers.push({name,mobile,address:cAddress.value.trim(),jarRate:+cJarRate.value||0,canRate:+cCanRate.value||0,openDue:0,openJar:0,openCan:0,updatedAt:new Date().toISOString()});
  }
  saveState();clearCustomerForm();renderCustomers();renderHome();toast("Customer saved");
}
function prepareEntry(){
  eDate.value=eDate.value||dateISO();
  eCustomer.innerHTML=state.customers.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${escAttr(c.mobile)}">${esc(c.name)} — ${esc(c.mobile)}</option>`).join("");
  updateEntryAmount();
}
function updateEntryAmount(){
  const c=state.customers.find(x=>x.mobile===eCustomer.value);if(!c)return;
  const amt=(+eJg.value||0)*(+c.jarRate||0)+(+eCg.value||0)*(+c.canRate||0);
  if(!eAmount.dataset.manual) eAmount.value=amt;
  entryHint.textContent=`Rate: Jar ₹${c.jarRate||0} · Can ₹${c.canRate||0} · Current due ${money(c.openDue)}`;
}
function saveEntry(){
  const c=state.customers.find(x=>x.mobile===eCustomer.value);if(!c){toast("Customer select karein");return}
  const entry={date:eDate.value||dateISO(),name:c.name,jg:+eJg.value||0,je:+eJe.value||0,cg:+eCg.value||0,ce:+eCe.value||0,amount:+eAmount.value||0,paid:+ePaid.value||0,previousDue:+c.openDue||0};
  state.entries.push(entry);
  c.openDue=(+c.openDue||0)+entry.amount-entry.paid;
  c.openJar=(+c.openJar||0)+entry.jg-entry.je;
  c.openCan=(+c.openCan||0)+entry.cg-entry.ce;
  c.updatedAt=new Date().toISOString();
  saveState(); renderHome(); renderHistory(); toast("Daily entry saved");
}
function renderHistory(){
  const d=hDate.value, q=(hSearch.value||"").toLowerCase().trim();
  let arr=state.entries.slice().reverse();
  if(d)arr=arr.filter(e=>e.date===d);
  if(q)arr=arr.filter(e=>e.name.toLowerCase().includes(q));
  historyList.innerHTML=arr.length?arr.map(e=>`<div class="item"><div class="name">${esc(e.name)}</div><div class="small">${fmtDate(e.date)} · Jar ${e.jg||0} · Can ${e.cg||0}</div><span class="pill">Amount ${money(e.amount)}</span><span class="pill">Paid ${money(e.paid)}</span><span class="pill">Previous Due ${money(e.previousDue)}</span></div>`).join(""):`<div class="empty">No entries found.</div>`;
}
function downloadBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}), a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="Aqua_Super_Backup_"+dateISO()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup downloaded");
}
function restoreBackup(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.customers)||!Array.isArray(x.entries))throw 0;state=x;saveState();location.reload()}catch(e){toast("Invalid backup file")}};
  r.readAsText(f);
}
function resetToBundled(){if(confirm("Bundled 24 Aug 2026 backup se current app data replace karna hai?")){state=clone(BUNDLED_DATA);saveState();location.reload()}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return esc(s)}
document.getElementById("todayText").textContent=new Date().toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
dashDate.value=dateISO(); eDate.value=dateISO();
["eJg","eCg"].forEach(id=>document.getElementById(id).addEventListener("input",()=>{delete eAmount.dataset.manual;updateEntryAmount()}));
eAmount.addEventListener("input",()=>eAmount.dataset.manual="1");
eCustomer.addEventListener("change",updateEntryAmount);
renderHome();prepareEntry();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
