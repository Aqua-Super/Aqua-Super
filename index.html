<html lang="en">
<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f7fb;color:#17324d}
.top{background:#075985;color:#fff;padding:18px 15px;border-radius:0 0 22px 22px}
.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;font-size:13px}
main{padding:14px 12px 85px;max-width:700px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box,.form{background:#fff;border-radius:15px;padding:14px;box-shadow:0 2px 9px #0001;margin-bottom:12px}
.lbl{font-size:12px;color:#708090}.num{font-size:22px;font-weight:700;margin-top:5px}
button{width:100%;padding:13px;border:0;border-radius:11px;background:#0ea5e9;color:#fff;font-weight:700;font-size:15px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
input,select{width:100%;padding:12px;border:1px solid #ccd8e3;border-radius:10px;font-size:15px;background:#fff}
label{display:block;font-size:12px;color:#64748b;margin:10px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
h2{font-size:18px;margin:5px 0 12px}.item{padding:12px 0;border-bottom:1px solid #e5edf3}
.item:last-child{border:0}.red{color:#d62828}.green{color:#15803d}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d8e2ea;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}
nav button{border-radius:0;background:#fff;color:#64748b;font-size:12px;padding:10px 3px}
nav button.active{color:#075985;font-weight:bold}
.small{font-size:12px;color:#64748b}.msg{padding:10px;border-radius:10px;background:#e9f7ef;color:#166534;margin-top:10px}
hr{border:0;border-top:1px solid #e5edf3;margin:16px 0}
</style>

<script>
function aquaPaymentReminder(customer){
  try{
    customer = customer || {};
    var name = customer.name || customer.customerName || "";
    var phone = customer.mobile || customer.phone || "";
    var dueRaw = customer.due ?? customer.dueAmount ?? customer.balance ?? customer.totalDue ?? 0;
    var due = Number(String(dueRaw).replace(/[^\d.-]/g,"")) || 0;
    if(due <= 0){
      alert("Is customer ka koi due amount nahi hai.");
      return;
    }
    var msg =
      "Hello " + name + " Ji,\n\n" +
      "Aapka Aqua Super ka ₹" + due.toFixed(0) + " payment due hai.\n" +
      "Aapse request hai ki please apna pending payment convenient time par kar dein.\n" +
      "Payment karne ke baad please hume inform kar dein.\n\n" +
      "Thank you – Aqua Super";
    var url="https://wa.me/"+String(phone).replace(/\D/g,"")+"?text="+encodeURIComponent(msg);
    if(confirm(msg+"\n\nWhatsApp kholen?")) window.open(url,"_blank");
  }catch(e){
    alert("Payment reminder banane mein problem hui.");
  }
}
</script>

<style id="aquaPaymentReminderStyle">
.aqua-payment-reminder-btn{display:inline-block;margin:6px 0;padding:8px 12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="top"><h1>💧 Aqua Super</h1><p id="today"></p></div>
<main id="main"></main>
<nav>
<button id="nHome" onclick="go('home')">🏠<br/>Home</button>
<button id="nCust" onclick="go('customers')">👥<br/>Customers</button>
<button id="nEntry" onclick="go('entry')">🚚<br/>Daily Entry</button>
<button id="nLog" onclick="go('dailyLog')">📋<br/>Daily Log</button>
<button id="nHist" onclick="go('history')">🔎<br/>History</button>
</nav>
<div id="aquaGoogleDriveCard" style="margin:16px 12px 20px;padding:16px;border-radius:16px;background:#f0fdf4;border:1px solid #bbf7d0;">
<div style="font-size:18px;font-weight:800;color:#166534;">☁️ Google Drive Backup</div>
<div style="font-size:13px;color:#475569;margin:7px 0 12px;">पहली बार Google Login करें। उसके बाद रोज़ यहीं से backup सीधे Google Drive में जाएगा।</div>
<button onclick="aquaDriveBackup()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#16a34a;color:white;font-size:16px;font-weight:800;">☁️ Google Login / Backup</button>
</div><script>
var KEY="AQUA_SUPER_DATA_2";
var db={customers:[],entries:[]};
try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}
function normalizeDB(){
 if(!db||typeof db!=="object")db={customers:[],entries:[]};
 if(!Array.isArray(db.customers))db.customers=[];
 if(!Array.isArray(db.entries))db.entries=[];
 db.customers.forEach(function(c){c.openDue=Number(c.openDue)||0;c.openJar=Number(c.openJar)||0;c.openCan=Number(c.openCan)||0;c.jarRate=Number(c.jarRate)||0;c.canRate=Number(c.canRate)||0;});
 db.entries.forEach(function(e){e.jg=Number(e.jg)||0;e.je=Number(e.je)||0;e.cg=Number(e.cg)||0;e.ce=Number(e.ce)||0;e.amount=Number(e.amount)||0;e.paid=Number(e.paid)||0;});
}
normalizeDB();
function save(){localStorage.setItem(KEY,JSON.stringify(db));try{setTimeout(function(){if(typeof aquaSaveDailyBackup==="function")aquaSaveDailyBackup();},50)}catch(e){}}
function money(n){return "₹"+(Number(n)||0).toLocaleString("en-IN")}
function dateNow(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var dashboardDate=dateNow();
function dayName(d){return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long"})}
function selectedDateLabel(d){return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"2-digit",month:"long",year:"numeric"})}
function setDashboardDate(d){
 var today=dateNow();
 if(!d)d=today;
 if(d>today)d=today;
 dashboardDate=d;
 home();
 document.getElementById("today").textContent=selectedDateLabel(d);
}

function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function cget(name){for(var i=0;i<db.customers.length;i++)if(db.customers[i].name===name)return db.customers[i];return null}
function stat(c){
 var due=Number(c.openDue)||0,jar=Number(c.openJar)||0,can=Number(c.openCan)||0;
 for(var i=0;i<db.entries.length;i++){var e=db.entries[i];if(e.name===c.name){due+=e.amount-e.paid;jar+=e.jg-e.je;can+=e.cg-e.ce}}
 return {due:due,jar:jar,can:can}
}
function setNav(p){["nHome","nCust","nEntry","nLog","nHist"].forEach(function(id){var el=document.getElementById(id);if(el)el.className=""});var map={home:"nHome",customers:"nCust",entry:"nEntry",dailyLog:"nLog",history:"nHist"};if(document.getElementById(map[p]))document.getElementById(map[p]).className="active"}
function go(p){setNav(p);if(p==="home")home();if(p==="customers")customers();if(p==="entry")entry();if(p==="dailyLog")dailyLog();if(p==="history")history()}
document.getElementById("today").textContent=selectedDateLabel(dashboardDate);

function home(){
 var selected=dashboardDate||dateNow();
 var te=db.entries.filter(function(e){return e.date===selected});
 var sales=0,paid=0,jg=0,cg=0;
 for(var i=0;i<te.length;i++){sales+=Number(te[i].amount)||0;paid+=Number(te[i].paid)||0;jg+=Number(te[i].jg)||0;cg+=Number(te[i].cg)||0}

 // Historical due as of the selected date.
 var due=0;
 for(var j=0;j<db.customers.length;j++){
  var c=db.customers[j],d=Number(c.openDue)||0;
  for(var k=0;k<db.entries.length;k++){
   var e=db.entries[k];
   if(e.name===c.name && e.date<=selected)d+=(Number(e.amount)||0)-(Number(e.paid)||0);
  }
  due+=Math.max(0,d);
 }

 var today=dateNow();
 document.getElementById("today").textContent=selectedDateLabel(selected);
 document.getElementById("main").innerHTML=
 '<div class="form" style="margin-bottom:12px">'+
 '<div style="font-weight:700;font-size:17px;margin-bottom:10px">📅 Dashboard Date</div>'+
 '<input id="dashboardDatePicker" type="date" value="'+selected+'" max="'+today+'" onchange="setDashboardDate(this.value)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff">'+
 '<div class="small" style="margin-top:8px">Selected: '+selectedDateLabel(selected)+'</div>'+
 '</div>'+
 '<div class="grid">'+
 '<div class="box"><div class="lbl">Total Customers</div><div class="num">'+db.customers.length+'</div></div>'+
 '<div class="box"><div class="lbl">'+(selected===today?'Today':'Selected Date')+' Sales</div><div class="num">'+money(sales)+'</div></div>'+
 '<div class="box"><div class="lbl">'+(selected===today?'Today':'Selected Date')+' Payment</div><div class="num">'+money(paid)+'</div></div>'+
 '<div class="box"><div class="lbl">Due on '+fmt(selected)+'</div><div class="num red">'+money(due)+'</div></div>'+
 '<div class="box"><div class="lbl">Jar Given</div><div class="num">'+jg+'</div></div>'+
 '<div class="box"><div class="lbl">Can Given</div><div class="num">'+cg+'</div></div>'+
 '</div>'+
 '<div class="btns"><button onclick="go(\'customers\')">👤 Add / Search Customer</button><button onclick="go(\'entry\')">➕ New Daily Entry</button></div>'+
 '<div class="form"><h2>🔴 Customers With Due</h2><div style="margin:10px 0 12px"><input id="dueCustomerSearch" type="search" placeholder="🔎 Customer name ya mobile number search karein..." oninput="filterDueCustomers(this.value)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;background:#fff"></div><div id="dueList">'+dueList()+'</div></div>'+
 '<div class="form"><button onclick="backup()">💾 Backup Data</button><br><br><button onclick="document.getElementById(\'restore\').click()">♻️ Restore Backup</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(this)"></div>';
}
function dueList(){
 var arr=[],q=String(window._dueCustomerSearch||"").toLowerCase().trim();
 for(var i=0;i<db.customers.length;i++){
  var c=db.customers[i],st=stat(c);
  if(st.due>0){
   var hay=(String(c.name)+" "+String(c.mobile)).toLowerCase();
   if(q && hay.indexOf(q)<0) continue;
   arr.push({c:c,st:st});
  }
 }
 arr.sort(function(a,b){return Number(b.st.due)-Number(a.st.due);});
 var out="";
 for(var i=0;i<arr.length;i++){
  var c=arr[i].c,st=arr[i].st,n=enc(c.name);
  out+='<div class="item"><b>'+esc(c.name)+' Ji</b><br><span class="small">'+esc(c.mobile)+'</span> · <span class="red">'+money(st.due)+'</span><br><div class="btns" style="margin-top:7px">'+
   '<button style="padding:8px" onclick="sendWAByName(\''+n+'\')">📲 WhatsApp Due</button>'+
   '<button style="margin-top:7px;padding:8px;background:#2563eb;color:#fff;border:0;border-radius:8px" onclick="sendLatestSMS(\''+n+'\')">💬 SIM SMS</button>'+
   '<button style="padding:8px;background:#16a34a" onclick="sendPaymentReminder(\''+n+'\')">💰 Payment Reminder</button>'+
   '<button style="margin-top:7px;padding:8px;background:#2563eb;color:#fff;border:0;border-radius:8px" onclick="sendReminderSMS(\''+n+'\')">💬 Reminder SMS</button>'+
   '</div></div>';
 }
 if(arr.length) return out;
 return q?'<span class="small">Is search se koi due customer nahi mila.</span>':'<span class="small">Abhi koi due customer nahi.</span>';
}
function filterDueCustomers(q){
 window._dueCustomerSearch=q||"";
 var box=document.getElementById("dueList");
 if(box) box.innerHTML=dueList();
}
function customers(){
 document.getElementById("main").innerHTML=
 '<div class="form"><h2>👥 Customer Master</h2><div class="small">Customer Name, Mobile aur Address sirf ek baar save karein.</div>'+
 '<label>Search Customer</label><input id="q" oninput="customerList()" placeholder="Name ya mobile">'+
 '<div id="cl"></div><hr><h2>➕ New Customer</h2>'+
 '<label>Customer Name</label><input id="cn">'+
 '<label>Mobile Number</label><input id="cm" inputmode="tel">'+
 '<label>Address</label><input id="ca">'+
 '<div class="row"><div><label>Jar Rate</label><input id="jr" type="number" value="25"></div><div><label>Can Rate</label><input id="cr" type="number" value="0"></div></div>'+
 '<div class="row"><div><label>Previous Due</label><input id="od" type="number" value="0"></div><div><label>Opening Jar Balance</label><input id="oj" type="number" value="0"></div></div>'+
 '<label>Opening Can Balance</label><input id="oc" type="number" value="0"><br><br>'+
 '<button onclick="addCustomer()">💾 Save Customer</button></div>';
 customerList();
}
function customerList(){
 var q=(document.getElementById("q").value||"").toLowerCase(),out="";
 for(var i=0;i<db.customers.length;i++){var c=db.customers[i];if(c.name.toLowerCase().indexOf(q)>=0||String(c.mobile).indexOf(q)>=0){var s=stat(c);out+='<div class="item"><b>'+esc(c.name)+' Ji</b><br><span class="small">'+esc(c.mobile)+' · '+esc(c.address)+'</span><br>Due: <b class="red">'+money(s.due)+'</b> · Jar: <b>'+s.jar+'</b> · Can: <b>'+s.can+'</b>+customerRecentInfo(c)<br><div class="btns" style="margin:8px 0 0"><button onclick="editCustomerByName(\''+enc(c.name)+'\')" style="padding:9px">✏️ Edit</button><button onclick="deleteCustomerByName(\''+enc(c.name)+'\')" style="padding:9px;background:#dc2626">🗑️ Delete</button></div></div>'}}
 document.getElementById("cl").innerHTML=out||'<p class="small">Customer nahi mila.</p>';
}
function addCustomer(){
 var name=document.getElementById("cn").value.trim(),mobile=document.getElementById("cm").value.trim(),address=document.getElementById("ca").value.trim();
 if(!name||!mobile){alert("Name aur Mobile Number bharna zaroori hai.");return}
 if(cget(name)){alert("Ye customer already saved hai.");return}
 db.customers.push({name:name,mobile:mobile,address:address,jarRate:Number(document.getElementById("jr").value)||0,canRate:Number(document.getElementById("cr").value)||0,openDue:Number(document.getElementById("od").value)||0,openJar:Number(document.getElementById("oj").value)||0,openCan:Number(document.getElementById("oc").value)||0,updatedAt:new Date().toISOString()});
 save();alert("Customer save ho gaya.");customers();
}

function editCustomerByName(encodedName){
 var name=dec(encodedName);
 var c=cget(name);
 if(!c){alert("Customer nahi mila.");return;}
 var s=stat(c);
 var newName=prompt("Customer Name:",c.name);
 if(newName===null)return;
 newName=newName.trim();
 if(!newName){alert("Customer name khali nahi ho sakta.");return;}
 var newMobile=prompt("Mobile Number:",c.mobile);
 if(newMobile===null)return;
 var newAddress=prompt("Address:",c.address);
 if(newAddress===null)return;
 var newJarRate=prompt("Jar Rate:",c.jarRate);
 if(newJarRate===null)return;
 var newCanRate=prompt("Can Rate:",c.canRate);
 if(newCanRate===null)return;
 var newDue=prompt("Current Due / Balance:",s.due);
 if(newDue===null)return;
 var newJarBal=prompt("Current Jar Balance:",s.jar);
 if(newJarBal===null)return;
 var newCanBal=prompt("Current Can Balance:",s.can);
 if(newCanBal===null)return;
 var oldName=c.name;
 c.name=newName;
 c.mobile=String(newMobile).trim();
 c.address=String(newAddress).trim();
 c.jarRate=Number(newJarRate)||0;
 c.canRate=Number(newCanRate)||0;
 c.openDue=Number(newDue||0) - (s.due - (Number(c.openDue)||0));
 c.openJar=Number(newJarBal||0) - (s.jar - (Number(c.openJar)||0));
 c.openCan=Number(newCanBal||0) - (s.can - (Number(c.openCan)||0));
 c.updatedAt=new Date().toISOString();
 if(oldName!==newName){
   for(var i=0;i<db.entries.length;i++){
     if(db.entries[i].name===oldName) db.entries[i].name=newName;
   }
 }
 save();
 alert("Customer details update ho gayi.");
 customers();
}

function deleteCustomerByName(encodedName){
 var name=dec(encodedName);
 var c=cget(name);
 if(!c)return;
 var hasEntries=db.entries.some(function(e){return e.name===name;});
 var msg=hasEntries
   ? "Is customer ki purani delivery entries bhi saved hain. Customer ko delete karne par uski saved entries bhi delete ho jayengi. Kya delete karna hai?"
   : "Kya is customer ko delete karna hai?";
 if(!confirm(msg))return;
 db.customers=db.customers.filter(function(x){return x.name!==name;});
 db.entries=db.entries.filter(function(e){return e.name!==name;});
 save();
 alert("Customer delete ho gaya.");
 customers();
}

function customerLastWater(c){
 var list=db.entries.filter(function(e){return e.name===c.name && e.date;});
 if(!list.length)return null;
 list.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
 return list[0].date;
}
function daysAgo(dateStr){
 if(!dateStr)return "";
 var d=new Date(dateStr+"T00:00:00"), t=new Date();
 t.setHours(0,0,0,0);
 var n=Math.floor((t-d)/86400000);
 if(n<=0)return "Today";
 if(n===1)return "1 day ago";
 return n+" days ago";
}
function recentUpdatedText(c){
 if(!c.updatedAt)return "Not updated yet";
 var d=new Date(c.updatedAt);
 if(isNaN(d.getTime()))return "Not updated yet";
 return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
}
function customerRecentInfo(c){
 var last=customerLastWater(c);
 return '<div class="small" style="margin-top:7px">💧 <b>Last Water:</b> '+(last ? fmt(last)+" · "+daysAgo(last) : "No delivery yet")+'<br>🕒 <b>Recently Updated:</b> '+recentUpdatedText(c)+'</div>';
}

function balanceLabel(n){
 return Number(n)<0 ? "Advance Amount" : "Due Amount";
}
function balanceMoney(n){
 return money(n);
}
function entry(){
 if(!db.customers.length){
   document.getElementById("main").innerHTML='<div class="form"><h2>Pehle Customer add karein.</h2><button onclick="go(\'customers\')">👤 Add Customer</button></div>';
   return;
 }
 document.getElementById("main").innerHTML=
 '<div class="form"><h2>🚚 Daily Entry</h2>'+
 '<label>Date</label><input id="dt" type="date" value="'+dateNow()+'">'+
 '<label>🔎 Search Customer</label><input id="entrySearch" oninput="filterEntryCustomers()" placeholder="Naam ya mobile number likhein..." autocomplete="off">'+
 '<div id="entryResult" style="margin-top:10px"></div>'+
 '<input id="en" type="hidden">'+
 '<div class="row"><div><label>Address</label><input id="ea" readonly></div><div><label>Mobile</label><input id="em" readonly></div></div>'+
 '<div class="box" style="margin:10px 0;background:#fff7ed;border:1px solid #fed7aa"><div class="lbl" id="eprevLabel">Previous Balance / Previous Due</div><div id="eprev" class="num red">₹0</div></div>'+
 '<div class="row"><div><label>Jar Rent (Today)</label><input id="ejr" type="number" min="0" step="0.01" placeholder=""></div><div><label>Can Rent (Today)</label><input id="ecr" type="number" min="0" step="0.01" placeholder=""></div></div>'+
 '<h2>🫙 Jar</h2><div class="row"><div><label>Jar Given</label><input id="jg" type="number" min="0" placeholder="" placeholder="" placeholder=""></div><div><label>Empty Jar Received</label><input id="je" type="number" min="0" placeholder="" placeholder="" placeholder=""></div></div>'+
 '<h2>🥫 Can</h2><div class="row"><div><label>Can Given</label><input id="cg" type="number" min="0" placeholder="" placeholder="" placeholder=""></div><div><label>Empty Can Received</label><input id="ce" type="number" min="0" placeholder="" placeholder="" placeholder=""></div></div>'+
 '<label>Payment Received</label><input id="pay" type="number" min="0" placeholder="" placeholder="" placeholder="">'+
 '<div id="preview" class="msg">Customer select karne ke liye upar naam ya mobile search karein.</div><br><button onclick="saveEntry(false)">💾 Save Entry</button><br><br><button onclick="saveEntry(true)">🟢 Save + Send WhatsApp</button><br><br><button onclick="saveEntrySMS()">💬 Save + Send SMS</button></div>';

 ["jg","je","cg","ce","pay","ejr","ecr"].forEach(function(id){
   document.getElementById(id).oninput=preview;
 });
 document.getElementById("entrySearch").focus();
}
function filterEntryCustomers(){
 var box=document.getElementById("entrySearch");
 var result=document.getElementById("entryResult");
 if(!box||!result)return;
 var q=(box.value||"").trim().toLowerCase();
 if(!q){
   result.innerHTML="";
   if(document.getElementById("eprev")) document.getElementById("eprev").textContent=money(0);
   return;
 }
 var list=db.customers.slice().sort(function(a,b){
   return a.name.localeCompare(b.name,undefined,{sensitivity:"base"});
 });
 var matches=[];
 for(var i=0;i<list.length;i++){
   var c=list[i];
   if(c.name.toLowerCase().indexOf(q)>=0 || String(c.mobile).indexOf(q)>=0) matches.push(c);
 }
 if(matches.length===0){
   result.innerHTML='<div class="small">Customer nahi mila.</div>';
   if(document.getElementById("eprev")) document.getElementById("eprev").textContent=money(0);
   return;
 }
 if(matches.length===1){
   selectEntryCustomer(enc(matches[0].name));
   return;
 }
 var out='<div class="small" style="margin-bottom:6px">'+matches.length+' matching customers — ek customer select karein:</div>';
 for(var j=0;j<matches.length;j++){
   out+='<button onclick="selectEntryCustomer(\''+enc(matches[j].name)+'\')" style="margin-bottom:7px;text-align:left;background:#f1f7fb;color:#17324d;border:1px solid #d6e3ec">👤 '+esc(matches[j].name)+' Ji'+customerRecentInfo(matches[j])+'</button>';
 }
 result.innerHTML=out;
}
function selectEntryCustomer(encodedName){
 var name=dec(encodedName);
 var c=cget(name);
 if(!c)return;
 document.getElementById("en").value=c.name;
 document.getElementById("entryResult").innerHTML='<div class="msg" style="background:#eaf7ef;color:#166534"><b>Selected: '+esc(c.name)+' Ji</b>'+customerRecentInfo(c)+'</div>';
 document.getElementById("ea").value=c.address;
 document.getElementById("em").value=c.mobile;
 document.getElementById("ejr").value=(c.jarRate||0);
 document.getElementById("ecr").value=(c.canRate||0);
 document.getElementById("eprev").textContent=money(stat(c).due);
 preview();
}

/* Aqua Super - Daily Local Backup Store */
const AQUA_DAILY_DB="AquaSuperDailyBackups";
const AQUA_DAILY_STORE="backups";

function aquaOpenDailyDB(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open(AQUA_DAILY_DB,1);
    req.onupgradeneeded=function(e){
      var d=e.target.result;
      if(!d.objectStoreNames.contains(AQUA_DAILY_STORE)){
        d.createObjectStore(AQUA_DAILY_STORE,{keyPath:"date"});
      }
    };
    req.onsuccess=function(){resolve(req.result)};
    req.onerror=function(){reject(req.error)};
  });
}

async function aquaSaveDailyBackup(){
  try{
    var d=new Date();
    var date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    var dbx=await aquaOpenDailyDB();
    await new Promise(function(resolve,reject){
      var tx=dbx.transaction(AQUA_DAILY_STORE,"readwrite");
      tx.objectStore(AQUA_DAILY_STORE).put({
        date:date,
        createdAt:new Date().toISOString(),
        data:JSON.parse(JSON.stringify(db))
      });
      tx.oncomplete=resolve; tx.onerror=function(){reject(tx.error)};
    });
    dbx.close();
    return date;
  }catch(e){ console.error("Daily backup error",e); return null; }
}

async function aquaListDailyBackups(){
  var dbx=await aquaOpenDailyDB();
  var rows=await new Promise(function(resolve,reject){
    var tx=dbx.transaction(AQUA_DAILY_STORE,"readonly");
    var req=tx.objectStore(AQUA_DAILY_STORE).getAll();
    req.onsuccess=function(){resolve(req.result||[])};
    req.onerror=function(){reject(req.error)};
  });
  dbx.close();
  return rows.sort(function(a,b){return b.date.localeCompare(a.date)});
}

async function aquaRestoreDailyBackup(date){
  var dbx=await aquaOpenDailyDB();
  var row=await new Promise(function(resolve,reject){
    var tx=dbx.transaction(AQUA_DAILY_STORE,"readonly");
    var req=tx.objectStore(AQUA_DAILY_STORE).get(date);
    req.onsuccess=function(){resolve(req.result)};
    req.onerror=function(){reject(req.error)};
  });
  dbx.close();
  if(!row) throw new Error("Backup not found");
  if(!confirm("Restore "+date+" backup? Current data will be replaced.")) return;
  db=row.data;
  localStorage.setItem("AQUA_SUPER_DATA_2",JSON.stringify(db));
 try{aquaSaveDailyBackup();}catch(e){}

async function aquaDeleteDailyBackup(date){
  if(!confirm("Delete backup "+date+"?")) return;
  var dbx=await aquaOpenDailyDB();
  await new Promise(function(resolve,reject){
    var tx=dbx.transaction(AQUA_DAILY_STORE,"readwrite");
    tx.objectStore(AQUA_DAILY_STORE).delete(date);
    tx.oncomplete=resolve; tx.onerror=function(){reject(tx.error)};
  });
  dbx.close();
  aquaShowDailyBackups();
}

async function aquaShowDailyBackups(){
  var el=document.getElementById("aquaDailyBackupList");
  if(!el)return;
  var rows=await aquaListDailyBackups();
  var today=new Date();
  var todayStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  var latest=rows.length ? rows[0].date : todayStr;

  el.innerHTML=
    '<div style="padding:10px 0 6px">'+
      '<div style="font-weight:700;margin-bottom:8px">📅 Backup Date Select Karein</div>'+
      '<input id="aquaBackupDatePicker" type="date" value="'+latest+'" max="'+todayStr+'" onchange="aquaShowSelectedBackup(this.value)" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:#fff">'+
    '</div>'+
    '<div id="aquaSelectedBackupActions" style="padding-top:8px"></div>';

  aquaShowSelectedBackup(latest);
}

async function aquaShowSelectedBackup(date){
  var el=document.getElementById("aquaSelectedBackupActions");
  if(!el)return;
  var dbx=await aquaOpenDailyDB();
  var row=await new Promise(function(resolve,reject){
    var tx=dbx.transaction(AQUA_DAILY_STORE,"readonly");
    var req=tx.objectStore(AQUA_DAILY_STORE).get(date);
    req.onsuccess=function(){resolve(req.result)};
    req.onerror=function(){reject(req.error)};
  });
  dbx.close();

  if(!row){
    el.innerHTML='<div style="padding:10px 0;color:#64748b">Is date ka backup available nahi hai.</div>';
    return;
  }

  el.innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #e2e8f0">'+
      '<b style="flex:1">Aqua Super Daily Backup Data - '+date+'</b>'+
      '<button onclick="aquaRestoreDailyBackup(\''+date+'\')" style="padding:8px 12px">Restore</button>'+
      '<button onclick="aquaDeleteDailyBackup(\''+date+'\')" style="padding:8px 12px;background:#dc2626;color:#fff">Delete</button>'+
    '</div>';
}

function aquaDriveBackup(){

  var d=new Date();

function aquaImportOldBackup(){
  var input=document.createElement("input");
  input.type="file"; input.accept=".json,application/json";
  input.onchange=function(){
    var f=input.files && input.files[0]; if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var x=JSON.parse(r.result);
        if(!x || typeof x!=="object") throw new Error();
        if(!confirm("Purana Aqua Super backup import karein? Current browser data replace hoga.")) return;
        db=x;
        localStorage.setItem("AQUA_SUPER_DATA_2",JSON.stringify(db));
        location.reload();
      }catch(e){alert("Backup file valid nahi hai.");}
    };
    r.readAsText(f);
  };
  input.click();
}
