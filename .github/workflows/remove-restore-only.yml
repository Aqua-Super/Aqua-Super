name: Remove Restore Button Only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only Restore from Google Drive card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<button\b[^>]*>\s*♻️\s*Restore from Google Drive\s*</button>'
          matches = list(re.finditer(pattern, s, flags=re.S))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Restore button, found {len(matches)}')
          s = s[:matches[0].start()] + s[matches[0].end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only the button removal and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-restore-only.yml
          git diff --cached --check
          git commit -m "Remove only Restore from Google Drive button"
          git push