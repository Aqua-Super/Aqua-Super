name: Apply Restore Button Only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only Restore from Google Drive card
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button onclick="aquaShowGoogleDriveRestore()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:white;font-size:16px;font-weight:800;margin-top:10px;">♻️ Restore from Google Drive</button>\n'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one Restore button, found {s.count(old)}')
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only the button removal and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/remove-restore-only.yml
          git diff --cached --check
          git commit -m "Remove only Restore from Google Drive button"
          git push