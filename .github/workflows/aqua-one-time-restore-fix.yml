name: Aqua Super one-time restore button fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove only Restore from Google Drive button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- AQUA-ONE-TIME-RESTORE-FIX -->'
          if marker not in s:
              patch = '''\n<!-- AQUA-ONE-TIME-RESTORE-FIX -->\n<script>\n(function(){\n  function hideRestoreGoogleDrive(){\n    document.querySelectorAll('button,a,[role="button"]').forEach(function(el){\n      var t=(el.textContent||'').trim().replace(/\\s+/g,' ').toLowerCase();\n      if(t.indexOf('restore from google drive') !== -1){\n        el.style.display='none';\n      }\n    });\n  }\n  hideRestoreGoogleDrive();\n  if(document.documentElement){\n    new MutationObserver(hideRestoreGoogleDrive).observe(document.documentElement,{subtree:true,childList:true});\n  }\n})();\n</script>\n'''
              if '</body>' in s:
                  s=s.replace('</body>', patch+'</body>', 1)
              else:
                  s += patch
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit exact UI-only patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/aqua-one-time-restore-fix.yml
          git commit -m 'Fix: hide only Restore from Google Drive button' || exit 0
          git rm .github/workflows/aqua-one-time-restore-fix.yml
          git commit -m 'Remove temporary restore button fix workflow'
          git push
