name: Restore Aqua Super Home Layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only extra Home cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Aqua_Super.html')
          s=p.read_text(encoding='utf-8')
          start1='<div id="aquaInstallCard"'
          end1='</div>\n<main id="main">'
          start2='<div id="aquaGoogleDriveCard"'
          end2='</div><script>\nvar KEY='
          if start1 not in s or end1 not in s:
              raise SystemExit('Install card target not found; no change made.')
          if start2 not in s or end2 not in s:
              raise SystemExit('Google Drive card target not found; no change made.')
          a=s.index(start1); b=s.index(end1,a)+len(end1)-len('<main id="main">')
          s=s[:a]+s[b:]
          a=s.index(start2); b=s.index(end2,a)+len(end2)-len('var KEY=')
          s=s[:a]+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aqua_Super.html
          git diff --cached --check
          git diff --cached -- Aqua_Super.html
          git commit -m 'Restore original Aqua Super Home layout'
          git push
          git rm .github/workflows/restore-home-layout.yml
          git commit -m 'Remove temporary home layout workflow'
          git push
