name: Restore Notes Tab Directly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-notes-direct.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="nNotes"' not in s:
              marker="<button id=\"nHist\" onclick=\"go('history')\">🔎<br/>History</button>"
              if marker not in s: raise SystemExit('History button not found')
              s=s.replace(marker, marker+"\n<button id=\"nNotes\" onclick=\"aquaOpenNotes()\">📝<br/>Notes</button>",1)
          s=s.replace('grid-template-columns:repeat(5,1fr)','grid-template-columns:repeat(6,1fr)',1)
          if 'id="aqua-direct-notes-style"' not in s:
              css='''<style id="aqua-direct-notes-style">.aqua-notes-wrap{margin:0 0 14px;padding:14px 12px 18px;background:#fff}.aqua-notes-title{font-size:22px;font-weight:800;color:#17324d}.aqua-notes-sub{font-size:13px;color:#64748b;margin:6px 0 12px}.aqua-notes-text{width:100%;min-height:150px;padding:13px;border:1px solid #ccd8e3;border-radius:12px;font-size:16px;box-sizing:border-box}.aqua-notes-actions,.aqua-note-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.aqua-note-wa{background:#16a34a!important}.aqua-note-sms{background:#2563eb!important}.aqua-note-customer{padding:13px 0;border-bottom:1px solid #e5edf3}.aqua-note-name{font-size:17px;font-weight:800}.aqua-note-phone{font-size:12px;color:#64748b;margin-top:3px}.aqua-note-btns button{font-size:13px;padding:11px 5px}.aqua-notes-search-wrap{padding:0 12px 10px;background:#fff}.aqua-notes-search{width:100%;padding:12px 14px;border:1px solid #ccd8e3;border-radius:10px;font-size:15px;box-sizing:border-box}.aqua-notes-noresult{padding:10px 0;color:#64748b}@media(max-width:360px){.aqua-notes-actions,.aqua-note-btns{grid-template-columns:1fr}}</style>'''
              js='''<script id="aqua-direct-notes-script">(function(){var K='AQUA_SUPER_NOTES_MESSAGE_1';function E(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}function A(){return window.db&&Array.isArray(db.customers)?db.customers:[]}function M(){var x=document.getElementById('aquaNotesMessage');return x?x.value.trim():''}function L(q){var b=document.getElementById('aquaNotesCustomerList');if(!b)return;q=String(q||'').toLowerCase().trim();var o='',n=0;A().forEach(function(c,i){var p=String(c.mobile||c.phone||'').replace(/\\D/g,'');if(p.length<10)return;var h=(String(c.name||'')+' '+p).toLowerCase();if(q&&h.indexOf(q)<0)return;n++;o+='<div class="aqua-note-customer"><div class="aqua-note-name">'+E(c.name||'Customer')+' Ji</div><div class="aqua-note-phone">📱 '+E(p)+'</div><div class="aqua-note-btns"><button class="aqua-note-wa" onclick="aquaNoteSend('+i+',\\'wa\\')">📲 WhatsApp</button><button class="aqua-note-sms" onclick="aquaNoteSend('+i+',\\'sms\\')">💬 SIM SMS</button></div></div>'});b.innerHTML=n?o:'<div class="aqua-notes-noresult">Is search se koi customer nahi mila.</div>'}window.aquaNoteSend=function(i,ch){var c=A()[i],m=M();if(!c||!m){alert('Pehle Notes message type karein.');return}try{localStorage.setItem(K,m)}catch(e){}var p=String(c.mobile||c.phone||'').replace(/\\D/g,'');location.href=ch==='wa'?'https://wa.me/'+p+'?text='+encodeURIComponent(m):'sms:'+p+'?body='+encodeURIComponent(m)};window.aquaNotesFilter=function(q){L(q)};window.aquaNotesAll=function(ch){var m=M(),a=A().filter(function(c){return String(c.mobile||c.phone||'').replace(/\\D/g,'').length>=10});if(!m){alert('Pehle Notes message type karein.');return}if(!a.length){alert('Kisi customer ka valid mobile number nahi mila.');return}try{localStorage.setItem(K,m)}catch(e){}var p=String(a[0].mobile||a[0].phone).replace(/\\D/g,'');location.href=ch==='wa'?'https://wa.me/'+p+'?text='+encodeURIComponent(m):'sms:'+p+'?body='+encodeURIComponent(m)};window.aquaOpenNotes=function(){var m=document.getElementById('main');if(!m)return;document.querySelectorAll('nav button').forEach(function(b){b.className=''});document.getElementById('nNotes').className='active';var z='';try{z=localStorage.getItem(K)||''}catch(e){}m.innerHTML='<div class="aqua-notes-wrap"><div class="aqua-notes-title">📝 Notes / اطلاع</div><div class="aqua-notes-sub">Plant band, gaadi breakdown, staff nahi aaya ya koi bhi update customer ko bhejein.</div><textarea id="aquaNotesMessage" class="aqua-notes-text" placeholder="Yahan apna message manually type karein...">'+E(z)+'</textarea><div class="aqua-notes-actions"><button class="aqua-note-wa" onclick="aquaNotesAll(\\'wa\\')">📲 All Customer<br/>WhatsApp</button><button class="aqua-note-sms" onclick="aquaNotesAll(\\'sms\\')">💬 All Customer<br/>SIM SMS</button></div></div><div class="aqua-notes-search-wrap"><input class="aqua-notes-search" type="search" placeholder="🔎 Customer name ya mobile number search karein..." oninput="aquaNotesFilter(this.value)" autocomplete="off"></div><div class="box" style="margin:0 12px 12px"><h2>👥 All Customers</h2><div class="small">Har customer ko Notes message alag se WhatsApp ya SIM SMS kar sakte hain.</div><div id="aquaNotesCustomerList"></div></div>';L('');document.getElementById('aquaNotesMessage').addEventListener('input',function(){try{localStorage.setItem(K,this.value)}catch(e){}})}})();</script>'''
              s=s.replace('</head>',css+'</head>',1).replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore Notes tab and search in PWA'
          git push
