name: Aqua Notes Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Notes script
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          batch=Path('aqua_notes_batch_script.html').read_text(encoding='utf-8').strip()
          pattern=r'<script id="aqua-direct-notes-script">[\s\S]*?</script>'
          if not re.search(pattern,s):
              raise SystemExit('Notes script marker not found')
          s=re.sub(pattern,lambda m: batch,s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Notes All Customer batch sending"
          git rm .github/workflows/aqua-fix-notes.yml aqua_notes_batch_script.html
          git commit -m "Remove temporary Notes fix files"
          git push