name: One-time Payment Field Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Daily Entry payment field
        shell: python {0}
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = ''' db.entries.push(e);c.updatedAt=new Date().toISOString();save();
 if(wa){sendWA(e,c)}else{alert("Entry save ho gayi.");go("home")}'''
          new1 = ''' db.entries.push(e);c.updatedAt=new Date().toISOString();save();
 var paymentField=document.getElementById("pay");if(paymentField)paymentField.value="";
 if(wa){sendWA(e,c)}else{alert("Entry save ho gayi.");go("home")}'''

          old2 = ''' db.entries.push(e);c.updatedAt=new Date().toISOString();save();sendSMS(e,c);'''
          new2 = ''' db.entries.push(e);c.updatedAt=new Date().toISOString();save();
 var paymentField=document.getElementById("pay");if(paymentField)paymentField.value="";
 sendSMS(e,c);'''

          changed = False
          if old1 in s:
              s = s.replace(old1, new1, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Payment field reset patch applied.')
          else:
              print('Patch already applied; nothing to change.')

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-clear-payment.yml
          git add index.html
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Fix Daily Entry payment field reset"
          else
            git commit -m "Fix Daily Entry payment field reset"
          fi
          git push
