name: Fix Live PWA Home

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Google Drive home card only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<div id="aquaGoogleDriveCard"')
          main = s.find('<main id="main">', start if start >= 0 else 0)
          if start >= 0 and main > start:
              s = s[:start] + s[main:]
          s = s.replace('</nav>\n</div><div id="aquaDataStatus"', '</nav>\n<div id="aquaDataStatus"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only the home-card removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Google Drive card from live PWA home"
          git push
