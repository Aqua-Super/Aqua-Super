name: Daily Entry Amount Field Reset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Reset Daily Entry amount field') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply only amount field reset
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = 'var paymentField=document.getElementById("pay");if(paymentField)paymentField.value="";'
          if marker in s:
              raise SystemExit('Amount reset already present')

          # Only touch the two Daily Entry save functions. No other source is changed.
          patterns = [
              r'(function saveEntry\(wa\)\{.*?db\.entries\.push\(e\);c\.updatedAt=new Date\(\)\.toISOString\(\);save\(\);)(\s*if\(wa\)\{sendWA\(e,c\)\}else\{alert\("Entry save ho gayi\."\);go\("home"\)\})',
              r'(function saveEntrySMS\(\)\{.*?db\.entries\.push\(e\);c\.updatedAt=new Date\(\)\.toISOString\(\);save\(\);)(sendSMS\(e,c\);)'
          ]
          replacements = [
              r'\1\n var paymentField=document.getElementById("pay");if(paymentField)paymentField.value="";\2',
              r'\1\n var paymentField=document.getElementById("pay");if(paymentField)paymentField.value="";\2'
          ]

          for pattern, replacement in zip(patterns, replacements):
              s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit('Expected Daily Entry save target not found; refusing to modify index.html')
              s = s2

          p.write_text(s, encoding='utf-8')
          print('Applied only Payment Received (#pay) field reset to Save Entry, WhatsApp and SMS paths.')

      - name: Commit index.html and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/amount-field-reset.yml
          git commit -m "Reset Daily Entry amount field"
          git push
