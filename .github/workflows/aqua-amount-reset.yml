name: Aqua Amount Reset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch only Payment Received reset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Aqua_Super.html')
          s = p.read_text(encoding='utf-8')
          old = 'if(wa){sendWA(e,c);document.getElementById("pay").value=""}else{alert("Entry save ho gayi.");go("home")}\n}'
          new = 'if(wa){sendWA(e,c);document.getElementById("pay").value=""}else{document.getElementById("pay").value="";alert("Entry save ho gayi.");go("home")}\n}'
          if old not in s:
              raise SystemExit('Target code not found; no change made.')
          if s.count(old) != 1:
              raise SystemExit('Target code occurrence is not exactly one; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit exact one-line behavior change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aqua_Super.html
          git rm .github/workflows/aqua-amount-reset.yml
          git diff --cached --check
          git commit -m "Reset Amount field after Save Entry"
          git push
