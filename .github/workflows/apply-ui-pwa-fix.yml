name: Apply Aqua Super UI PWA Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ui-pwa-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI and PWA fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove wrongly placed Google Drive card from above <main>.
          start = s.find('<div id="aquaGoogleDriveCard"')
          main_marker = '<main id="main">'
          if start != -1:
              main_pos = s.find(main_marker, start)
              if main_pos != -1:
                  s = s[:start] + s[main_pos:]

          # Remove old external data-status block.
          s = re.sub(r'<div id="aquaDataStatus"[^>]*>.*?</div>\s*', '', s, count=1, flags=re.S)

          # Remove the closing wrapper left by the old misplaced card.
          s = s.replace('</nav>\n</div><script>', '</nav>\n<script>', 1)

          # Full mobile width while preserving app logic and data.
          old_css = 'main{padding:14px 12px 85px;max-width:700px;margin:auto}'
          new_css = 'main{width:100%;max-width:none;margin:0;padding:14px 0 85px;overflow-x:hidden}\n.form{margin-left:12px;margin-right:12px}\n.grid{margin-left:12px;margin-right:12px}\n.btns{margin-left:12px;margin-right:12px}'
          s = s.replace(old_css, new_css, 1)

          # Put Google Drive Backup at bottom of Home after normal Backup/Restore.
          if 'id="aquaGoogleDriveCard" class="form"' not in s:
              target = ''' '<div class="form"><button onclick="backup()">💾 Backup Data</button><br><br><button onclick="document.getElementById(\\'restore\\').click()">♻️ Restore Backup</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(this)"></div>';'''
              add = ''' '<div class="form"><button onclick="backup()">💾 Backup Data</button><br><br><button onclick="document.getElementById(\\'restore\\').click()">♻️ Restore Backup</button><input id="restore" type="file" accept=".json" style="display:none" onchange="restore(this)"></div>'+\n '<div id="aquaGoogleDriveCard" class="form" style="padding:16px;border-radius:16px;background:#f0fdf4;border:1px solid #bbf7d0;">'+\n '<div style="font-size:18px;font-weight:800;color:#166534;">☁️ Google Drive Backup</div>'+\n '<div style="font-size:13px;color:#475569;margin:7px 0 12px;">पहली बार Google Login करें। उसके बाद रोज़ यहीं से backup सीधे Google Drive में जाएगा।</div>'+\n '<button onclick="aquaDriveBackup()" style="width:100%;padding:13px;border:0;border-radius:12px;background:#16a34a;color:white;font-size:16px;font-weight:800;">☁️ Google Login / Backup</button>'+\n '</div>'+\n '<div id="aquaDataStatus" style="margin:0 12px 14px;padding:10px 12px;border-radius:12px;background:#eff6ff;color:#075985;font-size:12px;text-align:center">✅ Latest Aqua Super data package loaded · 25-Aug latest data</div>';'''
              if target not in s:
                  raise SystemExit('Home backup block not found; stopping safely.')
              s = s.replace(target, add, 1)

          # Ensure PWA manifest and install prompt.
          if '<link rel="manifest" href="manifest.webmanifest">' not in s:
              s = s.replace('</head>', '<link rel="manifest" href="manifest.webmanifest">\n<meta name="mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="apple-mobile-web-app-status-bar-style" content="default">\n<link rel="apple-touch-icon" href="icon-192.png">\n</head>', 1)
          if 'id="aquaInstallBtn"' not in s:
              s = s.replace('<div class="top"><h1>💧 Aqua Super</h1><p id="today"></p></div>', '<div class="top"><h1>💧 Aqua Super</h1><p id="today"></p></div><button id="aquaInstallBtn" type="button">📲 Install App</button>', 1)
          if 'id="aquaPWAInstall"' not in s:
              pwa = '''<script id="aquaPWAInstall">\n(function(){\n var deferredPrompt=null,btn=document.getElementById("aquaInstallBtn");\n window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;if(btn)btn.style.display="block";});\n if(btn)btn.addEventListener("click",async function(){if(!deferredPrompt){alert("Chrome menu (⋮) se Install app / Add to Home screen option bhi mil sakta hai.");return;}deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;btn.style.display="none";});\n window.addEventListener("appinstalled",function(){if(btn)btn.style.display="none";});\n if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(e){console.log("PWA SW",e);});});\n})();\n</script>\n'''
              s = s.replace('</body>', pwa + '</body>', 1)

          p.write_text(s, encoding='utf-8')
          print('index.html updated:', len(s), 'bytes')
          PY

      - name: Commit corrected index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Home Google Drive position, mobile width and PWA install [skip ci]'
          git push
