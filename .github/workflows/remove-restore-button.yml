name: Remove Restore Button Only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only Restore from Google Drive button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Restore from Google Drive'
          pos = s.find(old)
          if pos < 0:
              raise SystemExit('Restore from Google Drive text not found')
          # Remove the containing button element only, preserving the Google Drive Backup card.
          start = s.rfind('<button', 0, pos)
          end = s.find('</button>', pos)
          if start < 0 or end < 0:
              raise SystemExit('Containing button not found')
          end += len('</button>')
          s = s[:start] + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit only the button removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Restore from Google Drive button only"
          git push
